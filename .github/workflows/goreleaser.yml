# Release procedure:
# 1. Require a green CI run on main.
# 2. Create and push an annotated semantic-version tag.
# 3. Verify six platform archives and checksums.txt on the GitHub release.
# 4. Verify the Homebrew tap and Scoop bucket commits.
# 5. Install both packages and run `servd version`.
#
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Multiple prerelease and stable tags may point at the same commit.
          # Pin release selection to the tag that triggered this workflow.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository-scoped PATs are required because GITHUB_TOKEN cannot
          # update sibling package repositories.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}

  homebrew-smoke:
    name: Homebrew smoke (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: arm64
          - os: macos-15-intel
            target: x86_64
    steps:
      - name: Install released formula
        shell: bash
        run: |
          brew tap reidransom/tap
          brew install reidransom/tap/servd
          binary="$(brew --prefix reidransom/tap/servd)/bin/servd"
          version="$("$binary" version 2>&1)"
          test "$version" = "$("$binary" --version 2>&1)"
          expected="${GITHUB_REF_NAME#v}"
          test "${version#*version=$expected }" != "$version"

  scoop-smoke:
    name: Scoop smoke (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64
          - os: windows-11-arm
            target: arm64
    steps:
      - name: Install Scoop
        shell: pwsh
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
            Invoke-RestMethod https://get.scoop.sh | Invoke-Expression
          }
          (Join-Path $HOME "scoop\shims") | Out-File $env:GITHUB_PATH -Append
      - name: Install released manifest
        shell: pwsh
        run: |
          scoop bucket add reidransom https://github.com/reidransom/scoop-bucket
          scoop install reidransom/servd
          $binary = Join-Path $HOME "scoop\\shims\\servd.exe"
          $version = (& $binary version 2>&1 | Out-String).Trim()
          $flagVersion = (& $binary --version 2>&1 | Out-String).Trim()
          if ($version -ne $flagVersion) {
            throw "version command output differs: $version"
          }
          $expected = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($version -notmatch [regex]::Escape("version=$expected ")) {
            throw "installed version does not match $expected`: $version"
          }
