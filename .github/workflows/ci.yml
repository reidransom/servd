name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Check module files
        run: go mod tidy -diff
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          # golangci-lint v2 is required for code targeting Go 1.25.
          version: v2.6.2
          args: --timeout=30m --issues-exit-code=1

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./cmd/servd
      - name: Test
        run: go test ./...

  race:
    name: Race test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -race -cover

  snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Verify snapshot artifacts
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/servd_*.tar.gz dist/servd_*.zip)
          test "${#archives[@]}" -eq 6
          for archive in \
            dist/servd_Darwin_x86_64.tar.gz \
            dist/servd_Darwin_arm64.tar.gz \
            dist/servd_Linux_x86_64.tar.gz \
            dist/servd_Linux_arm64.tar.gz \
            dist/servd_Windows_x86_64.zip \
            dist/servd_Windows_arm64.zip
          do
            test -s "$archive"
          done
          test -s dist/checksums.txt
          test "$(wc -l < dist/checksums.txt)" -eq 6
          (cd dist && sha256sum --check checksums.txt)
          for archive in dist/*.tar.gz
          do
            test "$(tar -tzf "$archive" | sort | tr '\n' ' ')" = "LICENSE README.md servd "
          done
          for archive in dist/*.zip
          do
            test "$(unzip -Z1 "$archive" | sort | tr '\n' ' ')" = "LICENSE README.md servd.exe "
          done
      - name: Upload snapshot archives
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-release
          path: |
            dist/servd_*.tar.gz
            dist/servd_*.zip
            dist/checksums.txt
          retention-days: 1

  archive-smoke:
    name: Archive smoke (${{ matrix.target }})
    needs: snapshot
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: servd_Linux_x86_64.tar.gz
            format: tar
          - os: ubuntu-24.04-arm
            target: linux-arm64
            archive: servd_Linux_arm64.tar.gz
            format: tar
          - os: macos-15-intel
            target: darwin-x86_64
            archive: servd_Darwin_x86_64.tar.gz
            format: tar
          - os: macos-latest
            target: darwin-arm64
            archive: servd_Darwin_arm64.tar.gz
            format: tar
          - os: windows-latest
            target: windows-x86_64
            archive: servd_Windows_x86_64.zip
            format: zip
          - os: windows-11-arm
            target: windows-arm64
            archive: servd_Windows_arm64.zip
            format: zip
    steps:
      - name: Download snapshot archives
        uses: actions/download-artifact@v8
        with:
          name: snapshot-release
          path: dist
      - name: Run archived binary
        if: matrix.format == 'tar'
        shell: bash
        run: |
          mkdir extracted
          tar -xzf "dist/${{ matrix.archive }}" -C extracted
          version="$(./extracted/servd version)"
          test "$version" = "$(./extracted/servd --version)"
          test "${version#*version=dev}" = "$version"
          test "${version#*commit=$GITHUB_SHA}" != "$version"
          test "${version#*date=unknown}" = "$version"
      - name: Run archived binary
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          Expand-Archive "dist/${{ matrix.archive }}" -DestinationPath extracted
          $version = & .\extracted\servd.exe version
          if ($version -ne (& .\extracted\servd.exe --version)) {
            throw "version command output differs: $version"
          }
          if ($version -match "version=dev" -or
              $version -notmatch "commit=$env:GITHUB_SHA" -or
              $version -match "date=unknown") {
            throw "invalid snapshot metadata: $version"
          }
