# Built-in launcher rules, tried in order after `.servd.toml` and Procfile;
# the first rule that matches a project directory wins.
#
# These are defaults, not policy: copy any rule into
# ~/.config/servd/launchers.toml to customize it. A user rule with the same
# name replaces the built-in (set `disabled = true` to just turn one off), and
# user rules are always tried before the built-ins. Run `servd launchers` to
# see the effective merged rule set.

[[launcher]]
name = "jigyll"
exists = ["_config.yml", "_config.yaml"]
bin = "jigyll"
cmd = "jigyll serve -s . -H {host} -P {port} -w"

[[launcher]]
name = "jekyll"
exists = ["_config.yml", "_config.yaml"]
bin = "jekyll"
cmd = "jekyll serve --host {host} --port {port} --watch"

# Jekyll config present but neither tool installed: claim the site anyway so
# launching fails with a clear "command not found" instead of the site being
# silently skipped or misdetected.
[[launcher]]
name = "jigyll-missing-tool"
kind = "jigyll"
exists = ["_config.yml", "_config.yaml"]
cmd = "jigyll serve -s . -H {host} -P {port} -w"

[[launcher]]
name = "hugo"
exists = ["hugo.toml", "hugo.yaml", "hugo.json"]
bin = "hugo"
cmd = "hugo serve --bind {host} -p {port}"

# Older Hugo sites use config.toml; require a telltale content dir so an
# unrelated project's config.toml isn't claimed.
[[launcher]]
name = "hugo-legacy-config"
kind = "hugo"
exists = ["config.toml", "config.yaml", "config.json"]
dirs = ["content", "layouts", "archetypes"]
bin = "hugo"
cmd = "hugo serve --bind {host} -p {port}"

# package.json with a dev/serve/start script (first present wins). $PORT is
# exported for servers that honor it; the frameworks in port_flag_deps ignore
# $PORT, so port_flag is appended when one of them is a dependency.
[[launcher]]
name = "node"
npm_script = ["dev", "serve", "start"]
cmd = "npm run {script}"
port_flag = " -- --port {port}"
port_flag_deps = ["vite", "next", "astro", "nuxt", "@11ty/eleventy", "@sveltejs/kit", "svelte"]

[[launcher]]
name = "just"
recipe = { files = ["justfile", "Justfile", ".justfile"], target = "serve" }
bin = "just"
cmd = "just serve"

[[launcher]]
name = "make"
recipe = { files = ["Makefile", "makefile", "GNUmakefile"], target = "serve" }
bin = "make"
cmd = "make serve PORT={port}"

# Last resort: serve index.html with servd's built-in static file server.
[[launcher]]
name = "static"
exists = ["index.html"]
cmd = "{self} __static --host {host} --port {port} --dir ."
